<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <form id="contacto">
        <fieldset>
            <legend>Formulario de contacto</legend>
        <label>Nombre: </label>
        <input type="text" 
            name="nombre"
            id="nombre"
            placeholder="Ingrese su nombre"
            required>

<br /><br/>
        <label>Rut: </label>
        <input type="text" 
            name="rut"
            id="rut"
            placeholder="Formato 12321123-6"
            required>
<br /><br/>
        <label>Correo electronico: </label>
        <input type="email" 
            name="correo"
            id="correo">
<br /><br/>
        <label>Telefono: </label>
        <input type="tel" 
            name="fono"
            id="fono">
<br /><br/>
        <label>Fecha de Nacimiento: </label>
        <input type="date" 
            name="Fecha"
            id="Fecha"> 
<br /><br/>
        <label>Productos: </label>
        <select name="productos" id="productos">
            <option value="">SELECCIONE UN PRODUCTO</option>
            <option value="10">Vinilos</option>
            <option value="20">Cassete</option>
            <option value="30">CD</option>
        </select>
<br /><br/>
        <label>Cantidad: </label>
        <input type="number"
            name="cantidad"
            id="cantidad"
            min="1"
            max="99">  
<br /><br/>
        <label>Forma de Pago: </label>
<br /><br/>
        <label>Debito</label>
        <input type="radio" name="forma de pago" value="debito">
        <label>Credito</label>
        <input type="radio" name="forma de pago" value="credito">
        <label>Efectivo</label>
        <input type="radio" name="forma de pago" value="efectivo">

        <button type="submit">Enviar</button>

        </fieldset>
    </form>
    <script src="js/validaform.js"></script>
</body>
</html>
